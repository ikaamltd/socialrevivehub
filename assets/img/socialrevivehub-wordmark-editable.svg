<linearGradient id="sGradient" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="#1160F2"/><stop offset=".30" stop-color="#3C3FDE"/><stop offset=".63" stop-color="#9C2ACB"/><stop offset=".82" stop-color="#F33C90"/><stop offset="1" stop-color="#FF9661"/></linearGradient>
