<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 625 1200 250" role="img" aria-label="SocialReviveHub editable wordmark"><title>SocialReviveHub Wordmark</title><defs>
